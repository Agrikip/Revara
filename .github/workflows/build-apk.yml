name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RecallNotes-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Also publish the APK as a release so it can be downloaded straight to a phone.
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk RecallNotes.apk
          gh release create "build-${{ github.run_number }}" RecallNotes.apk --title "Recall Notes build ${{ github.run_number }}" --notes "Debug build from ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
